<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You - Bloom 🌸</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6fdf9;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      color: #22c55e;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      margin-bottom: 20px;
    }

    a {
      text-decoration: none;
      background: #22c55e;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>You're In! 🚀</h1>
    <p>We received your details. We’ll contact you shortly on WhatsApp.</p>
    <a href="index.html">Back to Home</a>
  </div>

</body>
</html>
